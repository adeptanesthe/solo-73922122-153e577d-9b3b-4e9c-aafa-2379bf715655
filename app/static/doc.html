<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>帮助文档 - 帮助中心搜索盲测</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="/">帮助中心搜索盲测</a>
      <nav>
        <a href="/">开始盲测</a>
        <a href="/docs">帮助文档</a>
        <a href="/summary">汇总看板</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="card">
      <p><a href="/docs">← 返回文档目录</a></p>
      <h1 id="title">加载中…</h1>
      <p class="meta" id="meta"></p>
      <div class="doc-body" id="body"></div>
    </section>
  </main>

  <script src="/static/common.js"></script>
  <script>
    const docId = location.pathname.split('/').pop();
    fetch('/api/docs/' + docId)
      .then(r => {
        if (!r.ok) throw new Error('文档不存在');
        return r.json();
      })
      .then(doc => {
        document.getElementById('title').textContent = doc.title;
        document.getElementById('meta').textContent = '文档编号 #' + doc.id;
        document.getElementById('body').textContent = doc.body;
      })
      .catch(err => {
        document.getElementById('title').textContent = '加载失败';
        document.getElementById('body').textContent = err.message;
      });
  </script>
</body>
</html>
